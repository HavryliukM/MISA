<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MISA - Monitorovanie teploty a vlhkosti pomocou ESP32 a DHT11">
    <title>MISA Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">

    <header>
        <div class="header-left">
            <h1>MISA &mdash; Monitorovanie Prostredia</h1>
            <p class="header-sub">ESP32 + DHT11 &bull; Live IoT Dashboard</p>
        </div>
        <div class="status-badge">
            <span id="status-dot" class="dot dot--offline"></span>
            <span id="status-text">Pripája sa k API...</span>
        </div>
    </header>

    <main>

        <!-- Metric Cards -->
        <div class="metrics-row">

            <div class="metric-card metric-card--temp">
                <div class="metric-icon-wrap metric-icon-wrap--temp">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>
                    </svg>
                </div>
                <div class="metric-body">
                    <div class="metric-label">Teplota</div>
                    <div class="metric-number">
                        <span id="temp-value">--</span>
                        <span class="metric-unit">°C</span>
                    </div>
                    <div class="metric-bar-track"><div class="metric-bar metric-bar--temp" id="temp-bar"></div></div>
                </div>
            </div>

            <div class="metric-card metric-card--hum">
                <div class="metric-icon-wrap metric-icon-wrap--hum">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
                    </svg>
                </div>
                <div class="metric-body">
                    <div class="metric-label">Vlhkosť</div>
                    <div class="metric-number">
                        <span id="hum-value">--</span>
                        <span class="metric-unit">%</span>
                    </div>
                    <div class="metric-bar-track"><div class="metric-bar metric-bar--hum" id="hum-bar"></div></div>
                </div>
            </div>

            <div class="metric-card metric-card--info">
                <div class="metric-icon-wrap metric-icon-wrap--info">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                    </svg>
                </div>
                <div class="metric-body">
                    <div class="metric-label">Posledná aktualizácia</div>
                    <div class="metric-timestamp" id="last-update">--</div>
                    <div class="metric-sub">DHT11 &bull; GPIO 4 &bull; ESP32 NodeMCU-32S</div>
                </div>
            </div>

        </div>

        <!-- Chart + Table -->
        <div class="bottom-row">
            <div class="card">
                <div class="card-title">Historický Vývoj (Posledných 50 meraní)</div>
                <div class="chart-wrap">
                    <canvas id="main-chart"></canvas>
                </div>
            </div>
            <div class="card">
                <div class="card-title">Tabuľka Hodnôt</div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Čas</th>
                                <th>Teplota&nbsp;(°C)</th>
                                <th>Vlhkosť&nbsp;(%)</th>
                            </tr>
                        </thead>
                        <tbody id="history-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>
</div>
<script src="{{ url_for('static', path='js/main.js') }}?v=6.0"></script>
</body>
</html>
