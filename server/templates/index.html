<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MISA - Meranie Fyzikálnej Veličiny s Vizualizáciou">
    <title>MISA Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-gauges@2.1.7/gauge.min.js"></script>
    <!-- Použitie Google Fontu pre prémiovejší dizajn -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .card { padding: 20px; }
        .gauges-wrap { display: flex; justify-content: center; gap: 40px; margin-top: 20px;}
        .gauge-item canvas { border-radius: 50%; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        #log-box { display: none; } /* Zatiaľ schováme logy, lebo už neovládame systém cez tlačidlá */
        .controls { display: none; }
    </style>
</head>
<body>
<div class="app">

    <header>
        <div class="header-left">
            <h1>MISA - Monitorovanie prostredia (DHT22)</h1>
        </div>
        <div class="status-badge">
            <span id="status-dot" class="dot dot--offline"></span>
            <span id="status-text">Pripája sa k API...</span>
        </div>
    </header>

    <main>

        <div class="row">
            <!-- Gauges card -->
            <div class="card" style="flex: 1;">
                <div class="card-title">Aktuálne Meranie</div>
                <div class="gauges-wrap">
                    <div class="gauge-item">
                        <canvas id="gauge-temp"></canvas>
                        <div style="text-align: center; margin-top: 10px; font-weight: bold; font-size: 1.2rem;">Teplota</div>
                    </div>
                    <div class="gauge-item">
                        <canvas id="gauge-hum"></canvas>
                        <div style="text-align: center; margin-top: 10px; font-weight: bold; font-size: 1.2rem;">Vlhkosť</div>
                    </div>
                </div>
                <div style="text-align: center; margin-top: 20px; color: #888;">
                    Posledná aktualizácia: <span id="last-update">Nikdy</span>
                </div>
            </div>
        </div>

        <div class="row" style="grid-template-columns: 2fr 1fr;">
            <!-- Chart card -->
            <div class="card">
                <div class="card-title">Historický Vývoj (Posledných 50 meraní)</div>
                <div class="chart-wrap" style="height: 350px;">
                    <canvas id="main-chart"></canvas>
                </div>
            </div>

            <!-- History card -->
            <div class="card">
                <div class="card-title">Tabuľka Hodnôt</div>
                <div class="table-wrap">
                    <table id="history-table">
                        <thead>
                            <tr>
                                <th>Čas</th>
                                <th>Teplota (°C)</th>
                                <th>Vlhkosť (%)</th>
                            </tr>
                        </thead>
                        <tbody id="history-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>
</div>

<script src="{{ url_for('static', path='js/main.js') }}?v=4.0"></script>
</body>
</html>
